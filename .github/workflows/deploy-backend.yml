name: Deploy — Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build image & trigger deploy
    runs-on: ubuntu-latest
    environment:
      name: production-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ghcr.io/${{ github.repository }}-backend:latest,ghcr.io/${{ github.repository }}-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger host deploy
        if: ${{ secrets.DEPLOY_HOOK_URL != '' }}
        run: curl -fsSL -X POST "${{ secrets.DEPLOY_HOOK_URL }}"

      - name: Smoke test
        if: ${{ vars.BACKEND_URL != '' }}
        run: |
          sleep 20 # give the host a moment to finish rolling out
          ./scripts/smoke-test.sh --backend-url "${{ vars.BACKEND_URL }}"

# ── Which path applies to you? ──────────────────────────────────────────────
#
# Using Render via render.yaml (the recommended path — see docs/DEPLOYMENT.md):
#   You don't need this workflow at all. Render's GitHub integration watches
#   this repo directly and redeploys automatically on every push to `main`
#   that touches backend/, running `alembic upgrade head` as a pre-deploy step
#   (see render.yaml). This workflow is for any OTHER container host.
#
# Using another host (Railway, Fly.io, a VPS, ...):
#   This workflow builds and pushes a container image to GHCR on every backend
#   change, then (optionally) pings a deploy-hook URL — the pattern most hosts
#   support for "redeploy on new image/webhook".
#
#   Required repository secret:
#     DEPLOY_HOOK_URL — your host's deploy-trigger webhook. If your host
#     instead pulls directly from GHCR, this step is unnecessary; if it needs
#     a CLI (e.g. `flyctl deploy`), swap this step for that CLI's Action.
#
#   Database migrations are NOT run here automatically — apply them as a
#   controlled release-phase step per your host's mechanism (see
#   docs/DEPLOYMENT.md, "Database migrations in production").
#
# Either path: set the repository VARIABLE (not secret) `BACKEND_URL` to your
# deployed backend's base URL to enable the post-deploy smoke test above.
