<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="og-title">
  <title id="og-title">EnochLabs — affordable websites and business software for growing businesses in Rwanda</title>
  <defs>
    <linearGradient id="og-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12151C" />
      <stop offset="1" stop-color="#1B1F29" />
    </linearGradient>
    <pattern id="ledger-lines" width="1200" height="48" patternUnits="userSpaceOnUse">
      <line x1="0" y1="47.5" x2="1200" y2="47.5" stroke="#F3F0E8" stroke-opacity="0.05" />
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#og-bg)" />
  <rect width="1200" height="630" fill="url(#ledger-lines)" />

  <!-- top border seal accent -->
  <rect x="0" y="0" width="1200" height="6" fill="#E8B34C" />

  <!-- eyebrow -->
  <text x="80" y="130" font-family="DejaVu Sans Mono, monospace" font-size="20" letter-spacing="4" fill="#E8B34C">
    ENOCHLABS — KIGALI, RWANDA
  </text>

  <!-- headline -->
  <text x="78" y="230" font-family="Lora, serif" font-weight="700" font-size="58" fill="#F3F0E8">
    Your business runs on
  </text>
  <text x="78" y="300" font-family="Lora, serif" font-weight="700" font-size="58" fill="#F3F0E8">
    a notebook. Let&#8217;s turn it
  </text>
  <text x="78" y="370" font-family="Lora, serif" font-weight="700" font-size="58" fill="#E8B34C">
    into a dashboard.
  </text>

  <text x="80" y="430" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#C7C2B5">
    Affordable websites &amp; business software for growing businesses.
  </text>

  <!-- ledger -> dashboard stat mock -->
  <g transform="translate(80,480)">
    <line x1="0" y1="0" x2="700" y2="0" stroke="#3A4256" />
    <text x="0" y="40" font-family="DejaVu Sans Mono, monospace" font-size="14" letter-spacing="2" fill="#8A91A6">STOCK</text>
    <text x="0" y="75" font-family="DejaVu Sans Mono, monospace" font-size="34" fill="#2F8F7B">142</text>

    <text x="220" y="40" font-family="DejaVu Sans Mono, monospace" font-size="14" letter-spacing="2" fill="#8A91A6">ORDERS</text>
    <text x="220" y="75" font-family="DejaVu Sans Mono, monospace" font-size="34" fill="#E8B34C">27</text>

    <text x="440" y="40" font-family="DejaVu Sans Mono, monospace" font-size="14" letter-spacing="2" fill="#8A91A6">REVENUE</text>
    <text x="440" y="75" font-family="DejaVu Sans Mono, monospace" font-size="34" fill="#F3F0E8">318k RWF</text>
  </g>

  <!-- wordmark, bottom right -->
  <text x="1120" y="580" text-anchor="end" font-family="Lora, serif" font-weight="700" font-size="26" fill="#F3F0E8">
    Enoch<tspan fill="#E8B34C">Labs</tspan>
  </text>
</svg>
