# Render Blueprint — Infrastructure as Code for the EnochLabs backend.
# https://render.com/docs/blueprint-spec
#
# What this does, in one step (New → Blueprint → connect this repo, in the
# Render dashboard):
#   1. Provisions a managed PostgreSQL instance ("enochlabs-db").
#   2. Builds and deploys the backend from backend/Dockerfile as a web service.
#   3. Wires DATABASE_URL from the provisioned database into the web service —
#      no manual connection-string copying.
#   4. Runs `alembic upgrade head` as a pre-deploy step on every deploy, so the
#      schema is always in sync with what's in backend/alembic/versions/
#      before the new version starts serving traffic (see docs/DEPLOYMENT.md,
#      "Database migrations in production").
#
# After the Blueprint syncs, set CORS_ORIGINS in the Render dashboard to the
# deployed frontend's URL (sync: false below means Render won't auto-fill it —
# see docs/DEPLOYMENT.md for the exact steps).

databases:
  - name: enochlabs-db
    databaseName: enochlabs
    user: enochlabs
    plan: free
    region: oregon

services:
  - type: web
    name: enochlabs-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /api/v1/health
    preDeployCommand: alembic upgrade head
    envVars:
      - key: PROJECT_NAME
        value: EnochLabs API
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: enochlabs-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false # set to the deployed frontend URL(s) after first sync
      - key: INQUIRY_NOTIFY_WEBHOOK
        sync: false # optional — set if you want new-inquiry notifications
